# Example rbtrfs configuration. Install to /etc/rbtrfs/config.toml
# or point at it with `rbtrfs --config` / $RBTRFS_CONFIG.

[profile.default]
repository = "/mnt/backup/restic"
password_file = "/etc/rbtrfs/repo.pw"
subvolumes = ["/", "/home", "/srv"]
# Excludes work like restic's: "/path" is as recorded in the backup; anything else matches at any depth.
exclude = ["**/.cache", "*.tmp"]
tags = ["rbtrfs", "nightly"]
keep_local = 2
keep_local_days = 3

# `rbtrfs forget` thins the repository with this policy (required by that command).
[profile.default.retention]
keep_last = 3
keep_daily = 7
keep_weekly = 4
keep_monthly = 12

[profile.default.hooks]
pre = []
post = []
on_failure = "abort"
