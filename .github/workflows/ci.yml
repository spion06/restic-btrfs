name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: libbtrfsutil
        run: sudo apt-get update && sudo apt-get install -y libbtrfsutil-dev pkg-config clang
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  e2e:
    # Real btrfs on a loop device. The runner is root-capable, so the tests run
    # directly instead of delegating to a container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y libbtrfsutil-dev pkg-config clang btrfs-progs restic attr
      - run: cargo test --test e2e_loopback --no-run
      - name: e2e (as root, serial)
        run: |
          sudo modprobe btrfs loop || true
          BIN=$(ls -t target/debug/deps/e2e_loopback-* | grep -v '\.d$' | head -1)
          sudo "$BIN" --test-threads=1
