name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu-26.04 rather than ubuntu-latest: the libbtrfsutil crate needs a
  # libbtrfsutil header newer than the one in Ubuntu 24.04 (btrfs-progs 6.6).
  lint:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbtrfsutil-dev pkg-config libclang-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib

  e2e:
    # Real btrfs on loop devices. As a normal user the tests re-run themselves in
    # privileged containers (the same path developers use), so the runner only
    # needs Docker: no restic or btrfs-progs install here.
    name: end-to-end (containers)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbtrfsutil-dev pkg-config libclang-dev
      - name: Load kernel modules
        run: sudo modprobe btrfs loop || true
      - run: cargo test --locked --test e2e_loopback
        env:
          RBTRFS_E2E_REQUIRED: "1"
